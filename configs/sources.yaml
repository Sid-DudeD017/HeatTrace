study:
  region: CAISO
  years: [2022, 2023, 2024, 2025]
  months: [6, 7, 8, 9]
  timezone: UTC

price:
  provider: CAISO
  product: day_ahead_hourly_lmp
  node: TH_NP15_GEN-APND
  units: USD_per_MWh

carbon:
  provider: EIA
  balancing_authority: CISO
  preferred_measure: production_based_gCO2_per_kWh

weather:
  provider: NOAA
  stations:
    - id: USW00023234
      name: San Francisco International Airport
      role: northern_coastal
    - id: USW00023232
      name: Sacramento Executive Airport
      role: northern_inland
    - id: USW00023174
      name: Los Angeles International Airport
      role: southern_coastal
  measure: hourly_temperature

qc:
  primary_station_id: USW00023234
  target_timezone: America/Los_Angeles
  baseline:
    years: [2024]
    months: [6, 7, 8, 9]
    percentile_method: linear_interpolation
    heatwave_percentile: 98.0
    tolerance_c: 0.5
    heatwave_threshold_min_c: null
    ordinary_day_range_c: [20.0, 24.0]
    threshold_label: "P1 empirical summer percentile threshold (baseline year 2024)"
  days:
    heatwave:
      date: "2024-07-02"
      type: heatwave
      rationale: "California early-July 2024 extreme-heat QC day; SFO airport recorded daily maximum of 31.1°C (88.0°F), exceeding the 98th percentile 2024 summer temperature threshold (30.0°C)."
      expected_max_temperature_c: 31.1
    ordinary:
      date: "2024-06-07"
      type: ordinary
      rationale: "Typical marine-layer moderated early summer day; SFO airport recorded daily maximum of 21.7°C (71.1°F), close to the 2024 summer median (20.6°C) and within ordinary range [20.0, 24.0]."
      expected_max_temperature_c: 21.7
  # Ingestion-only QC policy: permits status success_with_data_issues for P1 pipeline QC,
  # recognizing that EIA-930 Known Data Issues are flagged across modern balancing authority workbooks.
  # Downstream scientific analysis in P2/P5 must retain issue flags and perform sensitivity/exclusion analysis.
  fail_on_eia_data_issues: false
